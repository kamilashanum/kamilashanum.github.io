    <!-- Kontak -->
    <section id="kontak">
      <div class="container">
        <div class="row text-center mb-3">
          <div class="col">
            <h2>Kontak</h2>
          </div>
        </div>
        <div class="row justify-content-center">
          <div class="col-md-5">
            <div class="alert alert-success alert-dismissible fade show d-none my-alert" role="alert">
                <strong>Selamat!</strong> Pesan kamu sudah diterima.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <form name="contact-form">
              <div class="mb-3">
                <label for="name" class="form-label">Nama Lengkap</label>
                <input type="text" class="form-control" id="name" aria-describedby="name" name="nama"/>
              </div>
              <div class="mb-3">
                <label for="nik" class="form-label">NIK KTP</label>
                <input type="text" class="form-control" id="nik" aria-describedby="nik" name="nik"/>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="whatsapp" aria-describedby="email" name="email"/>
              </div>
              <div class="mb-3">
                <label for="nohp" class="form-label">No. Handphone</label>
                <input type="text" class="form-control" id="nohp" aria-describedby="nohp" name="nohp"/>
              </div>
              <div class="mb-3">
                <label for="ibukandung" class="form-label">Nama Lengkap Ibu Kandung</label>
                <input type="text" class="form-control" id="ibukandung" aria-describedby="ibukandung" name="ibukandung"/>
              </div>
              <div class="mb-3">
                <label for="kawin" class="form-label">Status Perkawinan</label>
              <select class="form-select form-select-sm" aria-label=".form-select-sm example" name="kawin">
                <option selected>Pilih salah satu saja</option>
                <option value="TK (Tidak Kawin)">TK (Tidak Kawin)</option>
                <option value="K0 (Kawin Anak 0)">K0 (Kawin Anak 0)</option>
                <option value="K1 (Kawin Anak 1)">K1 (Kawin Anak 1)</option>
                <option value="K2 (Kawin Anak 2)">K2 (Kawin Anak 2)</option>
                <option value="K3 (Kawin Anak 3>)">K3 (Kawin Anak 3>)</option>
              </select>
              </div><p></p>
              <div class="mb-3">
                <label for="tamatan" class="form-label">Tamatan</label>
              <select class="form-select form-select-sm" aria-label=".form-select-sm example" name="tamatan">
                <option selected>Pilih salah satu saja</option>
                <option value="SMA">SMA</option>
                <option value="SMK">SMK</option>
                <option value="D3">D3</option>
                <option value="S1/D3">S1/D4</option>
              </select>
              </div><p></p>
              <div class="mb-3">
                <label for="jurusan" class="form-label">Jurusan</label>
                <input type="text" class="form-control" id="jurusan" aria-describedby="jurusan" name="jurusan"/>
              </div><p></p>
              <div class="mb-3">
                <label for="jabatan" class="form-label">Jabatan</label>
              <select class="form-select form-select-sm" aria-label=".form-select-sm example" name="jabatan">
                <option selected>Pilih salah satu saja</option>
                <option value="SECURITY">SECURITY</option>
                <option value="HELPER">HELPER</option>
                <option value="DRIVER">DRIVER</option>
                <option value="CLEANING SERVICE">CLEANING SERVICE</option>
                <option value="ADMIN">ADMIN</option>
                <option value="SALES">SALES</option>
              </select><p></p>
              <div class="mb-3">
                <label for="lokasi" class="form-label">Lokasi Penugasan/Penempatan</label>
                <input type="text" class="form-control" id="lokasi" aria-describedby="lokasi" name="lokasi"/>
              </div>
              <button type="submit" class="btn btn-primary mb-3 btn-kirim">Kirim</button>
              <button class="btn btn-primary mb-3 btn-loading d-none" type="button" disabled>
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    Kirim

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <!-- script googlesheet -->
    <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxOWOnQKs_-0pq07BbZkisMIjnEtpyGlPUGyONUIUBzQYm6JCgvt1QT4NRAIazefWfl/exec'
    const form = document.forms['contact-form']
      const btnKirim = document.querySelector(".btn-kirim");
      const btnLoading = document.querySelector(".btn-loading");
      const myAlert = document.querySelector(".my-alert");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        // ketika tombol submit di klik
        // tampilkan tombol loading, hilangkan tombil kirim
        btnLoading.classList.toggle("d-none");
        btnKirim.classList.toggle("d-none");
        fetch(scriptURL, { method: "POST", body: new FormData(form) })
          .then((response) => {
            // tampilkan tombol kirim, hilangkan tombol loading
            btnLoading.classList.toggle("d-none");
            btnKirim.classList.toggle("d-none");
            // tampilkan alert
            myAlert.classList.toggle("d-none");
            // reset form
            form.reset();
            console.log("Success!", response);
          })
          .catch((error) => console.error("Error!", error.message));
      });
    </script>
